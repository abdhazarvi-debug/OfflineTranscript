name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ pdf-extractor-mobile ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: pdf-extractor-mobile
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Text-Extractor-debug
          path: pdf-extractor-mobile/app/build/outputs/apk/debug/app-debug.apk
